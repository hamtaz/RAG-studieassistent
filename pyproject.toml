[project]
name = "studieassistent"
version = "0.1.0"
description = "RAG-based study assistant: PDF -> chunks -> embeddings -> Cosmos DB vector search."
requires-python = ">=3.13"
dependencies = [
    "azure-ai-contentsafety>=1.0.0",
    "azure-cosmos>=4.16.3",
    "azure-identity>=1.19.0",
    "fastapi>=0.115.0",
    "openai>=2.53.0",
    "pdfplumber>=0.11.10",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
# Only needed to run the test suite / lint / type-check, never imported by
# main.py or src/*.
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "mypy>=2.3.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Puts the repo root on sys.path so tests can `import src.*` without an
# install step.
pythonpath = ["."]

[tool.ruff]
# The longest existing line in the repo is 108 (tests/test_config.py) - this
# fits current code rather than forcing a reflow of it.
line-length = 110
target-version = "py313"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes (real correctness-adjacent issues).
# I: import sorting.
# UP: pyupgrade (modern syntax).
# B: bugbear (common bug patterns).
# Deliberately not maximal (no ANN/docstring-coverage rules) - a meaningful,
# low-noise baseline rather than zero-tolerance churn on files this project
# didn't touch for that reason.
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# Without this, mypy doesn't know BaseSettings synthesizes an __init__ where
# required fields are optional-by-keyword (they can come from the
# environment / .env at runtime, not just from call-site arguments), and
# flags Settings() in get_settings() as missing every required field.
plugins = ["pydantic.mypy"]
# Scoped to src/ and main.py via the CLI invocation (mypy src main.py), not
# to scripts/ (manual one-off verification scripts) or tests/ (pytest tests,
# where full annotation coverage is unidiomatic). Deliberately not blanket
# `strict = True` - this is a middle ground: real annotations required, but
# not every strict-mode check.
disallow_untyped_defs = true
warn_return_any = true
no_implicit_optional = true
