[project]
name = "studieassistent"
version = "0.1.0"
description = "RAG-based study assistant: PDF -> chunks -> embeddings -> Cosmos DB vector search."
requires-python = ">=3.13"
dependencies = [
    "azure-cosmos>=4.16.3",
    "openai>=2.53.0",
    "pdfplumber>=0.11.10",
    "pydantic-settings>=2.15.0",
]

[project.optional-dependencies]
# Only needed to run the test suite, never imported by main.py or src/*.
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Puts the repo root on sys.path so tests can `import src.*` without an
# install step.
pythonpath = ["."]
